<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sii 浏览器</title>
<style>
  body{font-family:sans-serif;background:#f4f5f7;margin:0;padding:32px 16px;}
  h1{text-align:center;color:#333;font-size:30px;margin:8px 0 4px;}
  p.sub{text-align:center;color:#999;font-size:13px;margin:0 0 24px;}
  .search{display:flex;gap:8px;max-width:560px;margin:0 auto 32px;}
  input{flex:1;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;background:#fff;outline:none;}
  button{padding:0 22px;border:0;border-radius:12px;background:#4a7dff;color:#fff;font-size:16px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:560px;margin:0 auto;}
  .site{background:#fff;border-radius:14px;padding:16px 4px;text-align:center;text-decoration:none;color:#333;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .site span{display:block;font-size:26px;margin-bottom:6px;}
</style>
</head>
<body>
<h1>Sii</h1>
<p class="sub">轻量浏览器</p>
<div class="search">
  <input id="q" placeholder="输入网址或搜索内容">
  <button onclick="go()">前往</button>
</div>
<div class="grid">
  <a class="site" href="https://www.baidu.com"><span>🔍</span>百度</a>
  <a class="site" href="https://www.bing.com"><span>🅑</span>必应</a>
  <a class="site" href="https://www.zhihu.com"><span>知</span>知乎</a>
  <a class="site" href="https://www.bilibili.com"><span>哔</span>哔哩哔哩</a>
  <a class="site" href="https://github.com"><span>G</span>GitHub</a>
  <a class="site" href="https://www.qq.com"><span>腾</span>腾讯网</a>
  <a class="site" href="https://www.taobao.com"><span>淘</span>淘宝</a>
  <a class="site" href="https://m.weibo.cn"><span>微</span>微博</a>
</div>
<script>
function go(){
  var v=document.getElementById('q').value.trim();
  if(!v)return;
  if(/^https?:\/\//.test(v)){ location.href=v; }
  else{ location.href='https://www.bing.com/search?q='+encodeURIComponent(v); }
}
document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
</script>
</body>
</html>
